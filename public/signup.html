<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Lenja</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="nav-container"><a href="index.html" class="logo"><span class="logo-icon">🏺</span> Lenja</a><div class="search-wrap"><input placeholder="Search in Lenja"><button>⌕</button></div><nav><ul><li><a href="index.html">Home</a></li><li><a href="product.html">Products</a></li></ul></nav><div class="nav-actions"><a href="login.html">Login</a></div></div></header>
<section class="section"><div class="form-container"><h2 class="form-title">Create your Lenja account</h2><p class="form-subtitle">Register as a customer and start shopping.</p><form id="signup-form"><div class="form-group"><label>Full Name</label><input id="name" class="form-control" required></div><div class="form-group"><label>Email Address</label><input id="email" type="email" class="form-control" required></div><div class="form-group"><label>Phone</label><input id="phone" class="form-control"></div><div class="form-group"><label>Password</label><input id="password" type="password" minlength="6" class="form-control" required></div><div class="form-group"><label>Confirm Password</label><input id="confirm" type="password" minlength="6" class="form-control" required></div><button class="btn btn-primary" style="width:100%">Create Account</button></form><p id="signup-error" style="color:#e74c3c;margin-top:12px;text-align:center"></p><p style="text-align:center;margin-top:18px;font-size:13px;color:#777">Already registered? <a href="login.html">Login</a></p></div></section>
<script src="js/app.js"></script><script>document.getElementById('signup-form').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('signup-error');error.textContent='';const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){error.textContent='Passwords do not match.';return}try{const data=await api('/auth/signup',{method:'POST',body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,password})});setSession(data.token,data.user);location.href='dashboard.html';}catch(err){error.textContent=err.message;}});</script></body></html>
