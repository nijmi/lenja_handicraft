<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout - Lenja</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="nav-container"><a href="index.html" class="logo"><span class="logo-icon">🏺</span> Lenja</a><div class="search-wrap"><input placeholder="Search in Lenja"><button>⌕</button></div><nav><ul><li><a href="index.html">Home</a></li><li><a href="product.html">Products</a></li><li id="dashboard-link"><a href="dashboard.html">Dashboard</a></li><li id="admin-link"><a href="admin.html">Admin</a></li></ul></nav><div class="nav-actions"><div id="auth-area"><a href="login.html">Login</a></div><a href="cart.html" class="cart-icon">🛒<span id="cart-count" class="cart-count">0</span></a></div></div></header>
<section class="section"><div class="form-container" style="max-width:650px"><h1 class="form-title">Checkout</h1><p class="form-subtitle">Enter your delivery and payment details.</p><form id="checkout-form"><div class="form-group"><label>Full Name</label><input id="full-name" class="form-control" required></div><div class="form-group"><label>Email</label><input id="email" type="email" class="form-control" required></div><div class="form-group"><label>Phone</label><input id="phone" class="form-control" required></div><div class="form-group"><label>Delivery Address</label><textarea id="address" class="form-control" rows="3" required></textarea></div><div class="form-group"><label>Payment Method</label><select id="payment-method" class="form-control"><option value="cod">Cash on Delivery</option><option value="qr">Digital Payment (QR)</option></select></div><button class="btn btn-primary" style="width:100%">Place Order</button></form></div></section>
<script src="js/app.js"></script><script>
function closePaymentModal(){document.getElementById('payment-modal')?.remove()}
function showQrPayment(data){
  closePaymentModal();
  const modal=document.createElement('div'); modal.id='payment-modal'; modal.className='modal show';
  modal.innerHTML=`<div class="modal-card" style="text-align:center;max-width:470px">
    <div class="modal-head"><h2>Digital Payment</h2><button class="close-btn" onclick="closePaymentModal()">×</button></div>
    <p style="margin-bottom:6px">Scan this QR using your banking or digital-payment app.</p>
    <p style="font-weight:700;color:#f85606;font-size:20px;margin-bottom:10px">Total: ${money(data.amount)}</p>
    <img src="${data.qrImage}" alt="Lenja digital payment QR" style="width:270px;height:270px;object-fit:contain;border:8px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.12);margin:5px auto 15px;display:block">
    <p style="font-size:13px;color:#777;margin-bottom:12px">After completing the transfer, enter your transaction/reference number if available.</p>
    <input id="payment-reference" class="form-control" placeholder="Transaction / reference number (optional)" style="margin-bottom:12px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-primary" onclick="confirmQrPayment('${data.orderId}',true)">✓ Payment Done</button>
      <button class="btn btn-outline" onclick="confirmQrPayment('${data.orderId}',false)">✕ Unsuccessful</button>
    </div>
    <p style="font-size:12px;color:#999;margin-top:12px">QR payments are submitted for verification. The order is only treated as verified after the admin confirms the payment.</p>
  </div>`;
  document.body.appendChild(modal);
}
async function confirmQrPayment(orderId, completed){
  const reference=document.getElementById('payment-reference')?.value?.trim()||'';
  try{
    const r=await api('/payments/qr/confirm',{method:'POST',body:JSON.stringify({orderId,completed,reference})});
    closePaymentModal();
    if(r.ok){ location.href='payment-success.html?type=qr&orderId='+encodeURIComponent(orderId); }
    else { location.href='payment-failure.html?type=qr&orderId='+encodeURIComponent(orderId); }
  }catch(e){alert(e.message)}
}
document.addEventListener('DOMContentLoaded',()=>{const u=getCurrentUser();if(u){document.getElementById('full-name').value=u.name||'';document.getElementById('email').value=u.email||'';document.getElementById('phone').value=u.phone||'';}});
document.getElementById('checkout-form').addEventListener('submit',async e=>{e.preventDefault();if(!isLoggedIn()){location.href='login.html';return}if(isAdmin()){alert('Administrators cannot purchase products.');location.href='admin.html';return}const cart=getCart();if(!cart.length){alert('Your cart is empty.');location.href='product.html';return}try{const order=await api('/orders',{method:'POST',body:JSON.stringify({items:cart.map(i=>({productId:i.productId,quantity:i.quantity})),shipping:{name:document.getElementById('full-name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,address:document.getElementById('address').value},paymentMethod:document.getElementById('payment-method').value})});if(order.paymentMethod==='cod'){saveCart([]);location.href='payment-success.html?type=cod&orderId='+encodeURIComponent(order._id);return}if(order.paymentMethod==='qr'){const payment=await api('/payments/qr/init',{method:'POST',body:JSON.stringify({orderId:order._id})});showQrPayment(payment);return}const payment=await api('/payments/esewa/init',{method:'POST',body:JSON.stringify({orderId:order._id})});alert('This order uses the eSewa gateway.');showEsewaPopup(payment);}catch(err){alert(err.message);}});
</script></body></html>
