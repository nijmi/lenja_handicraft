<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shopping Cart - Lenja</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="nav-container"><a href="index.html" class="logo"><span class="logo-icon">🏺</span> Lenja</a><div class="search-wrap"><input placeholder="Search in Lenja"><button>⌕</button></div><nav><ul><li><a href="index.html">Home</a></li><li><a href="product.html">Products</a></li><li id="dashboard-link"><a href="dashboard.html">Dashboard</a></li><li id="admin-link"><a href="admin.html">Admin</a></li></ul></nav><div class="nav-actions"><div id="auth-area"><a href="login.html">Login</a></div><a href="cart.html" class="cart-icon">🛒<span id="cart-count" class="cart-count">0</span></a></div></div></header>
<section class="section"><h1 class="section-title">Shopping Cart</h1><p class="section-subtitle">Review your items before checkout.</p><div id="cart-content"><div class="table-wrap"><table class="cart-table"><thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Action</th></tr></thead><tbody id="cart-items-body"></tbody></table></div><div class="cart-summary"><div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">Rs. 0</span></div><div class="summary-row"><span>Shipping</span><span id="cart-shipping">Rs. 150</span></div><div class="summary-row total"><span>Total</span><span id="cart-total">Rs. 0</span></div><a id="checkout-link" href="checkout.html" class="btn btn-primary" style="width:100%;text-align:center;margin-top:12px">Proceed to Checkout</a></div></div></section>
<script src="js/app.js"></script><script>
async function renderCart(){if(isAdmin()){location.href='admin.html';return}const cart=getCart(),content=document.getElementById('cart-content');if(!cart.length){content.innerHTML='<div class="empty"><h3>Your cart is empty.</h3><p style="margin:8px 0 18px">Find something beautiful from our artisan collection.</p><a class="btn btn-primary" href="product.html">Browse Products</a></div>';return}let products=[];try{products=await api('/products');}catch(e){content.innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>';return}const map=new Map(products.map(p=>[String(p._id),p]));let subtotal=0;const body=document.getElementById('cart-items-body');body.innerHTML=cart.map(i=>{const p=map.get(String(i.productId));if(!p)return '';const sub=p.price*i.quantity;subtotal+=sub;return `<tr><td><div style="display:flex;align-items:center;gap:10px"><img class="admin-thumb" src="${escapeHtml(p.image)}"><b>${escapeHtml(p.name)}</b></div></td><td>${money(p.price)}</td><td><input class="form-control" style="width:75px" type="number" min="1" max="${p.stock}" value="${i.quantity}" onchange="updateQuantity('${p._id}',this.value)"></td><td>${money(sub)}</td><td><button class="btn btn-danger btn-small" onclick="removeItem('${p._id}')">Remove</button></td></tr>`}).join('');const ship=150;document.getElementById('cart-subtotal').textContent=money(subtotal);document.getElementById('cart-shipping').textContent=money(ship);document.getElementById('cart-total').textContent=money(subtotal+ship)}
function updateQuantity(id,q){const c=getCart(),i=c.find(x=>String(x.productId)===String(id));if(i){i.quantity=Math.max(1,Number(q)||1);saveCart(c);renderCart()}}
function removeItem(id){saveCart(getCart().filter(i=>String(i.productId)!==String(id)));renderCart()}
document.addEventListener('DOMContentLoaded',renderCart);
</script></body></html>
