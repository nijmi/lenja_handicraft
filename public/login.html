<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Lenja</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="nav-container"><a href="index.html" class="logo"><span class="logo-icon">🏺</span> Lenja</a><div class="search-wrap"><input placeholder="Search in Lenja"><button>⌕</button></div><nav><ul><li><a href="index.html">Home</a></li><li><a href="product.html">Products</a></li></ul></nav><div class="nav-actions"><a href="cart.html" class="cart-icon">🛒<span id="cart-count" class="cart-count">0</span></a></div></div></header>
<section class="section"><div class="form-container"><h2 class="form-title">Login to Lenja</h2><p class="form-subtitle">Sign in to your Lenja customer account.</p><form id="login-form"><div class="form-group"><label>Email Address</label><input id="email" type="email" class="form-control" required></div><div class="form-group"><label>Password</label><input id="password" type="password" class="form-control" required></div><button class="btn btn-primary" style="width:100%">Login</button></form><p id="login-error" style="color:#e74c3c;margin-top:12px;text-align:center"></p><p style="text-align:center;margin-top:18px;font-size:13px;color:#777">New customer? <a href="signup.html">Create an account</a></p></div></section>
<script src="js/app.js"></script><script>
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('login-error');error.textContent='';try{const data=await api('/auth/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});setSession(data.token,data.user);location.href=data.user.role==='admin'?'admin.html':'dashboard.html';}catch(err){error.textContent=err.message;}});
</script></body></html>
