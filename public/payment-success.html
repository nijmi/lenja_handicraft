<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Payment Result - Lenja</title><link rel="stylesheet" href="css/style.css"></head><body><section class="section"><div class="form-container" style="text-align:center"><div id="icon" style="font-size:55px;margin-bottom:10px">✓</div><h1 id="title">Verifying payment…</h1><p id="message">Please wait while Lenja verifies the transaction.</p><a id="back" class="btn btn-primary" href="dashboard.html" style="display:none;margin-top:18px">Go to Dashboard</a></div></section><script src="js/app.js"></script><script>(async()=>{const params=new URLSearchParams(location.search);const type=params.get('type');if(type==='qr'){saveCart([]);document.getElementById('title').textContent='Payment submitted successfully';document.getElementById('message').textContent='Your payment confirmation was received. The order is awaiting admin verification.';document.getElementById('back').style.display='inline-block';return}if(type==='cod'){saveCart([]);document.getElementById('title').textContent='Order placed successfully';document.getElementById('message').textContent='Your Cash on Delivery order has been received.';document.getElementById('back').style.display='inline-block';return}const data=params.get('data');if(!data){document.getElementById('title').textContent='Payment response missing';document.getElementById('message').textContent='Please check your dashboard or contact support.';document.getElementById('back').style.display='inline-block';return}try{const r=await api('/payments/esewa/verify',{method:'POST',body:JSON.stringify({data})});if(r.ok){saveCart([]);document.getElementById('title').textContent='Payment successful 🎉';document.getElementById('message').textContent='Your eSewa payment was verified and your order is now processing.'}else{document.getElementById('title').textContent='Payment unsuccessful';document.getElementById('message').textContent='eSewa reported status: '+r.status}document.getElementById('back').style.display='inline-block'}catch(e){document.getElementById('title').textContent='Payment verification failed';document.getElementById('message').textContent=e.message;document.getElementById('back').style.display='inline-block'}})();</script></body></html>
