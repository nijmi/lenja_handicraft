<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Payment Verification - Lenja</title><link rel="stylesheet" href="css/style.css"></head><body><section class="section"><div class="form-container" style="text-align:center"><div id="icon" style="font-size:58px">⏳</div><h1 id="title">Payment submitted</h1><p id="message">Your payment is waiting for verification. This page will update automatically.</p><div id="status-box" style="margin:20px 0;padding:14px;border-radius:8px;background:#f7f7f7">Status: <b id="status">Verification pending</b></div><a class="btn btn-primary" href="dashboard.html">Go to Dashboard</a></div></section><script src="js/app.js"></script><script>
(async()=>{const orderId=new URLSearchParams(location.search).get('orderId');if(!orderId)return;async function check(){try{const r=await api('/payments/qr/status/'+encodeURIComponent(orderId));if(r.status==='paid'){document.getElementById('icon').textContent='✅';document.getElementById('title').textContent='Payment successful';document.getElementById('message').textContent='Your payment was verified successfully. Your order is now being processed.';document.getElementById('status').textContent='Paid';return true}if(r.status==='failed'){document.getElementById('icon').textContent='❌';document.getElementById('title').textContent='Payment unsuccessful';document.getElementById('message').textContent='The payment could not be verified. Please contact Lenja or try placing the order again.';document.getElementById('status').textContent='Unsuccessful';return true}document.getElementById('status').textContent='Verification pending';return false}catch(e){document.getElementById('message').textContent=e.message;return false}}if(await check())return;const timer=setInterval(async()=>{if(await check())clearInterval(timer)},5000)})();
</script></body></html>
